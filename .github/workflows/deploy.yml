name: Deploy

on:
  push:
    branches: [main]
  # database 저장소가 글을 갱신하면 이 이벤트로 재빌드를 요청한다.
  repository_dispatch:
    types: [database-updated]
  workflow_dispatch:

# 배포는 한 번에 하나만 진행하고 앞선 실행은 취소한다.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # database 는 private 이라 GITHUB_TOKEN 으로 받지 못한다. 그 저장소에만 등록한
      # 배포 키로 SSH 를 열고, 해당 저장소 주소만 SSH 로 바꿔 나머지 요청은 그대로 둔다.
      - name: Set up database deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DATABASE_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config --global \
            url."git@github.com:MaxKim-J/knowledge-machine-database.git".insteadOf \
            "https://github.com/MaxKim-J/knowledge-machine-database.git"

      - run: git submodule update --init --depth 1 database

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # prebuild 가 서브모듈을 원격 최신 커밋으로 올린 뒤 정적 페이지를 만든다.
      - run: pnpm build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/blog/dist --project-name=knowledge-machine --branch=main
